[program:itsm_dispatcher]
command=python manage.py itsm_dispatch --interval 1 --batch-size 20
directory=%(ENV_PROJECT_DIR)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20
